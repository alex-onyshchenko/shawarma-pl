services:
  sync:
    build: ./services/sync
    ports:
      - "3002:3002"
    env_file:
      - ./services/sync/.env.${APP_ENV:-dev}
    environment:
      HOST: 0.0.0.0
      PORT: 3002
    volumes:
      - sync-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  client:
    build:
      context: ./apps/client
      args:
        APP_ENV: ${APP_ENV:-dev}
    ports:
      - "3000:80"
    depends_on:
      sync:
        condition: service_healthy
  kitchen:
    build:
      context: ./apps/kitchen
      args:
        APP_ENV: ${APP_ENV:-dev}
    ports:
      - "3001:80"
    depends_on:
      sync:
        condition: service_healthy
  analytics:
    profiles: ["analytics"]
    build:
      context: ./apps/analytics
      args:
        APP_ENV: ${APP_ENV:-dev}
    ports:
      - "3003:80"
    depends_on:
      sync:
        condition: service_healthy

  admin:
    build:
      context: ./apps/admin
      args:
        APP_ENV: ${APP_ENV:-dev}
    ports:
      - "3004:80"
    depends_on:
      sync:
        condition: service_healthy

  telegram-bot:
    profiles: ["bot"]
    build: ./services/telegram-bot
    env_file:
      - ./services/telegram-bot/.env.${APP_ENV:-dev}
    environment:
      HOST: 0.0.0.0
      PORT: 3005
    ports:
      - "3005:3005"

volumes:
  sync-data:
