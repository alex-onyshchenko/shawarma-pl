name: shaurmisha-sync
services:
  sync:
    build: ../../services/sync
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_PATH: /app/data/shawarma.prod.sqlite
    ports:
      - "127.0.0.1:3002:3002"
    volumes:
      - sync-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  admin:
    build: ../../apps/admin
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/admin/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      sync:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:?Set API_HOST in .env.prod}
      ADMIN_BASIC_USER: ${ADMIN_BASIC_USER:?Set ADMIN_BASIC_USER in .env.prod}
      ADMIN_BASIC_HASH: ${ADMIN_BASIC_HASH:?Set ADMIN_BASIC_HASH in .env.prod}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      sync:
        condition: service_healthy
      admin:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  sync-data:
    name: shaurmisha-sync-data
  caddy-data:
    name: shaurmisha-sync-caddy-data
  caddy-config:
    name: shaurmisha-sync-caddy-config
